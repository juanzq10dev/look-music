[project]
name = "look-music"
version = "0.1.0"
description = "Render MIDI files into falling-note piano videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.5",
    "mido>=1.3.3",
    "moderngl>=5.10",
    "numpy>=1.26",
    "pretty_midi>=0.2.10",
    "python-rtmidi>=1.5.8",
    "sounddevice>=0.5.6",
    "tinysoundfont>=0.3.7",
]

[project.scripts]
look-music = "look_music.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/look_music"]

[tool.pytest.ini_options]
testpaths = ["tests"]
